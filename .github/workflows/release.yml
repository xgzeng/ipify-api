name: Build and publish release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build Linux binaries and Debian package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" \
              -o "dist/ipify-api-linux-${arch}" .
          done

      - name: Install Debian packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            debhelper \
            dh-golang \
            golang-any \
            golang-github-julienschmidt-httprouter-dev \
            golang-github-rs-cors-dev

      - name: Build Debian package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9][A-Za-z0-9.+:~-]*$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          sed -i "1c\\ipify-api (${version}-1) unstable; urgency=medium" debian/changelog
          dpkg-buildpackage --build=binary --unsigned-source --unsigned-changes
          find .. -maxdepth 1 -type f -name 'ipify-api_*.deb' -exec cp {} dist/ \;

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
